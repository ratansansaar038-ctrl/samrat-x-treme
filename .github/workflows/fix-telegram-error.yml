
name: Fix Telegram Error Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve Telegram error handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("functions/game-wallet/src/main.js")
          code = path.read_text(encoding="utf-8")

          old = 'if (!data.ok) throw Error("Telegram delivery failed");'
          new = (
              'if (!data.ok) {'
              ' const status = response.statusCode;'
              ' const category = status === 401 ? "Invalid bot token"'
              ' : status === 403 ? "Bot access denied"'
              ' : status === 400 ? "Invalid chat ID or bot not started"'
              ' : status === 429 ? "Telegram rate limit"'
              ' : "Telegram API error";'
              ' reject(Error(category)); return;'
              ' }'
          )

          if code.count(old) != 1:
              raise SystemExit("Telegram error block not found")

          code = code.replace(old, new, 1)

          start = code.index('    if (action === "request_vc") {')
          
          end = code.index('if (action === "grant_coins") {', start)
          handler = (
              '    if (action === "request_vc") {\n'
              '      try {\n'
              '        const result = await requestVC(user, b, key);\n'
              '        return send(res, result.ok ? 200 : 400, result);\n'
              '      } catch (e) {\n'
              '        const safe = ["Invalid bot token",\n'
              '          "Bot access denied",\n'
              '          "Invalid chat ID or bot not started",\n'
              '          "Telegram rate limit", "Telegram API error"];\n'
              '        const reason = safe.includes(e.message)\n'
              '          ? e.message : "Telegram connection failed";\n'
              '        error("VC request failed: " + reason);\n'
              '        return send(res, 502, {ok:false,error:reason});\n'
              '      }\n'
              '    }\n\n'
          )

          code = code[:start] + handler + code[end:]
          path.write_text(code, encoding="utf-8")
          print("Telegram error diagnosis fixed")
          PY

      - name: Validate JavaScript
        run: node --check functions/game-wallet/src/main.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/game-wallet/src/main.js
          git diff --cached --quiet || (git commit -m "Fix Telegram error diagnosis" && git push)
          
