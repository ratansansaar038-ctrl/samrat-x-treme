name: Build Samrat X-Treme Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SAMRAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAMRAT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing SAMRAT_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing SAMRAT_KEYSTORE_PASSWORD secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/samrat-release.jks"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK" || { echo 'Unsigned APK not found'; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo 'Android apksigner not found'; exit 1; }
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/samrat-release.jks" \
            --ks-key-alias samrat-release \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:STORE_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/samrat-release.jks"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Samrat-X-Treme-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
