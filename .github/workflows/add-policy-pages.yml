
name: Add Legal Policy Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create policy pages and footer links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape

          policies = {
            "terms.html": (
              "Terms & Conditions",
              [
                ("Eligibility",
                 "Players must meet the applicable minimum age and comply with local laws."),
                ("Accounts",
                 "Players are responsible for their account security and accurate registration details."),
                ("Game Rules",
                 "Game rules, scoring and time limits are displayed within each game."),
                ("Virtual Coins",
                 "Coins are strictly virtual tokens with no cash value. They cannot be withdrawn, redeemed or exchanged for real money."),
                ("Fair Use",
                 "Cheating, bots, exploitation and unauthorized access are prohibited."),
                ("Changes",
                 "Rules and services may be updated. Material changes will be communicated through the platform.")
              ]
            ),
            "privacy.html": (
              "Privacy Policy",
              [
                ("Information Collected",
                 "Account information may include name, email address, login identifiers and game activity."),
                ("Use of Information",
                 "Information is used to provide accounts, gameplay, scoring, rankings, security and support."),
                ("Service Providers",
                 "Authorized infrastructure and authentication providers may process data to operate the platform."),
                ("Security",
                 "Reasonable security measures are used, but no online system is completely risk-free."),
                ("Your Rights",
                 "Players may request information about access, correction or deletion of personal data through the platform operator."),
                ("Policy Updates",
                 "Changes to this policy will be published on this page.")
              ]
            ),
            "fair-play.html": (
              "Fair Play Policy",
              [
                ("Virtual Tokens",
                 "Coins are strictly virtual tokens with no cash value. They cannot be withdrawn, redeemed or exchanged for real money."),
                ("Skill Games",
                 "Players must complete challenges using their own skills without automation or manipulation."),
                ("Prohibited Conduct",
                 "Bots, scripts, score tampering, exploiting bugs and coordinated cheating are prohibited."),
                ("Multiple Accounts",
                 "Creating multiple accounts to abuse rewards or rankings is prohibited."),
                ("Rankings",
                 "Invalid or manipulated results may be excluded from verified leaderboards."),
                ("Enforcement",
                 "Violations may result in score removal, restrictions or account suspension after review.")
              ]
            )
          }

          css = """
          body{margin:0;background:radial-gradient(
          ellipse at top,#47206b,#10071f 65%,#07030e);
          color:#fff;font:15px system-ui,Arial;line-height:1.7}
          main{max-width:680px;margin:auto;padding:24px 18px 60px}
          h1,h2{color:#ffe17b}
          h1{font-size:28px}
          h2{font-size:18px;margin-bottom:8px}
          section{background:#24143b;border:1px solid #7952a7;
          border-radius:16px;padding:17px;margin:14px 0}
          a{color:#ffe17b}
          .note{color:#d7c2ed;font-size:13px}
          """

          for filename,(title,sections) in policies.items():
              body = "".join(
                "<section><h2>"+escape(heading)+"</h2><p>"+
                escape(content)+"</p></section>"
                for heading,content in sections
              )
              page = (
                '<!doctype html><html lang="en"><head>'
                '<meta charset="utf-8">'
                '<meta name="viewport" content="width=device-width,initial-scale=1">'
                '<title>'+escape(title)+' | Samrat X-Treme</title>'
                '<style>'+css+'</style></head><body><main>'
                '<a href="index.html">← Back to Home</a>'
                '<h1>'+escape(title)+'</h1>'
                '<p class="note">Samrat X-Treme · Virtual Skill Gaming</p>'
                +body+
                '<p><a href="terms.html">Terms & Conditions</a> · '
                '<a href="privacy.html">Privacy Policy</a> · '
                '<a href="fair-play.html">Fair Play Policy</a></p>'
                '</main></body></html>'
              )
              Path(filename).write_text(page)

          p=Path("index.html")
          s=p.read_text()

          links = """
          <div class="policy-links" style="
            display:flex;justify-content:center;
            gap:12px;flex-wrap:wrap;margin:16px 0;
            font-size:12px">
            <a href="terms.html">Terms & Conditions</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="fair-play.html">Fair Play Policy</a>
          </div>
          """

          if 'href="fair-play.html"' not in s:
              s=s.replace(
                  '<footer class="small"',
                  links+'<footer class="small"',
                  1
              )
          p.write_text(s)

          print("Policy pages and footer links created.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html terms.html privacy.html fair-play.html
          if ! git diff --cached --quiet; then
            git commit -m "Add terms privacy and fair play policies"
            git push
          fi
