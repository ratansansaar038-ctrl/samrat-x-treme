name: Fix Samrat Winning Report Button Navigation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samrat-report-button-fix
  cancel-in-progress: false

jobs:
  fix-report-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Samrat X-Treme
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix report button scrolling and empty-round wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin-dashboard.html')
          content = path.read_text(encoding='utf-8')

          old_button = "   button.style.marginTop='8px';button.onclick=()=>loadWinningReport(r.roundId);"
          new_button = """   button.style.marginTop='8px';
             button.onclick=()=>{
               loadWinningReport(r.roundId);
               const panel=el('winReportPanel');
               panel.scrollIntoView({behavior:'smooth',block:'start'});
             };"""
          if content.count(old_button) == 1:
              content = content.replace(old_button, new_button, 1)
              print('FIXED: Clicking a round now scrolls to its Winning Number Report.')
          elif content.count(new_button) == 1:
              print('SKIP: Winning Report scroll is already installed.')
          else:
              raise SystemExit('Unexpected report button code; refusing to change the page.')

          old_message = "if(!d.players?.length)players.append(node('p','इस Round में किसी ने Winning Number नहीं चुना।','blank'));"
          new_message = "if(!d.players?.length)players.append(node('p',d.totalEntries===0?'इस Round में कोई Entry नहीं लगी।':'इस Round में किसी ने Winning Number नहीं चुना।','blank'));"
          if content.count(old_message) == 1:
              content = content.replace(old_message, new_message, 1)
              print('FIXED: No entries and no winners now show different messages.')
          elif content.count(new_message) == 1:
              print('SKIP: Empty-round message already installed.')
          else:
              raise SystemExit('Unexpected empty-round message; refusing to change the page.')

          assert "api('admin_round_report',{roundId})" in content
          assert "href=\"number-draw.html\"" in content
          assert "scrollIntoView({behavior:'smooth',block:'start'})" in content
          path.write_text(content,encoding='utf-8')
          PY
      - name: Check dashboard JavaScript syntax and button behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('admin-dashboard.html').read_text(encoding='utf-8')
          scripts = [x for x in re.findall(r'<script[^>]*>(.*?)</script>', html, re.S) if x.strip()]
          assert len(scripts) == 1, 'Expected one inline dashboard script'
          Path('/tmp/samrat-dashboard-check.js').write_text(scripts[0],encoding='utf-8')
          assert "loadWinningReport(r.roundId);" in scripts[0]
          assert "panel.scrollIntoView({behavior:'smooth',block:'start'});" in scripts[0]
          assert 'd.totalEntries===0' in scripts[0]
          print('PASS: Winning report button targets selected round and scrolls to report panel')
          print('PASS: Empty draw message is based on number of entries')
          PY
          node --check /tmp/samrat-dashboard-check.js
      - name: Commit page-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html
          if git diff --cached --quiet; then
            echo "REPORT_BUTTON_FIX_ALREADY_INSTALLED"
          else
            git commit -m "Make Winning Report button scroll to selected draw details"
            git push
            echo "REPORT_BUTTON_FIX_INSTALLED"
          fi
          echo "NOTE: This is a dashboard HTML-only update. No Appwrite function deployment required."
