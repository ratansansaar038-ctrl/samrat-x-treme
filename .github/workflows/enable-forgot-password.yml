
name: Enable Forgot Password

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add password recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          link = '<p style="text-align:center;margin:12px"><a href="forgot-password.html" style="color:#ffe16a">Forgot Password?</a></p>'

          for filename, anchor in [
              ("index.html", '<div class="status" id="authMsg">'),
              ("login.html", '<div id="message">')
          ]:
              p = Path(filename)
              s = p.read_text()
              if 'href="forgot-password.html"' not in s:
                  if anchor not in s:
                      raise SystemExit("Anchor missing: " + filename)
                  s = s.replace(anchor, link + "\n" + anchor, 1)
                  p.write_text(s)

          page = '''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Forgot Password | Samrat X-Treme</title>
          <script src="https://cdn.jsdelivr.net/npm/appwrite@21.4.0"></script>
          <style>
          body{background:#12051e;color:white;font-family:Arial;
          min-height:100vh;display:grid;place-items:center;margin:0;padding:15px}
          main{background:#281047;border:1px solid #7046d8;
          border-radius:20px;padding:25px;max-width:400px;width:100%;
          box-sizing:border-box}
          h2{color:#ffe16a}
          input,button{width:100%;padding:14px;margin:10px 0;
          box-sizing:border-box;border-radius:10px;font-size:15px}
          input{background:#10071d;color:white;border:1px solid #7046d8}
          button{background:#ffe16a;color:#210014;border:0;font-weight:bold}
          button:disabled{opacity:.5}
          a{color:#ffe16a}
          </style>
          </head>
          <body>
          <main>
          <h2>Forgot Password?</h2>
          <p>Enter your registered email to receive a reset link.</p>
          <form id="form">
          <input id="email" type="email" placeholder="Registered Email" required>
          <button id="send" type="submit">SEND RESET LINK</button>
          </form>
          <p id="message" role="status" aria-live="polite"></p>
          <a href="index.html">Back to Login</a>
          </main>
          <script>
          const client=new Appwrite.Client()
            .setEndpoint("https://sgp.cloud.appwrite.io/v1")
            .setProject("6a7f2add0011a7bfc21a");
          const account=new Appwrite.Account(client);
          document.getElementById("form").onsubmit=async e=>{
            e.preventDefault();
            const btn=document.getElementById("send");
            const msg=document.getElementById("message");
            btn.disabled=true;
            msg.textContent="Sending...";
            try{
              await account.createRecovery({
                email:document.getElementById("email").value.trim(),
                url:"https://samratxtreme.online/reset-password.html"
              });
              msg.textContent="If this email is registered, check your inbox for a reset link.";
            }catch(err){
              msg.textContent="Could not send reset link. Please try again.";
            }finally{
              btn.disabled=false;
            }
          };
          </script>
          </body></html>'''

          Path("forgot-password.html").write_text(page)
          print("Password recovery pages ready")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html login.html forgot-password.html
          git diff --cached --quiet || (git commit -m "Enable forgot password recovery" && git push)
