
name: Fix Number Challenge Multiple Entries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch game files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('functions/game-wallet/src/main.js')
          f = Path('number-draw.html')
          code = p.read_text()
          page = f.read_text()

          def change(src, old, new, label):
              if old not in src:
                  raise SystemExit('Missing expected code: ' + label)
              return src.replace(old, new, 1)

          code = change(
              code,
              '.update(user + "|" + current.roundId)',
              '.update(user + "|" + current.roundId + "|" + b.number)',
              'entry ID'
          )

          code = change(
              code,
              'const p = await profile(entry.userId, key);',
              'const p = await profile(entry.userId, key);\n      const previousEntries = await rows("game_entries", [eq("roundId", round.roundId), eq("userId", entry.userId), lim(100)], key);\n      const roundCounted = previousEntries.some(x => x.status === "won" || x.status === "lost");',
              'round count check'
          )

          code = change(
              code,
              '        op("increment", "user_profiles", p.$id, {\n          column: "rounds", value: 1\n        }),',
              '',
              'old rounds increment'
          )

          code = change(
              code,
              '      if (payout) operations.push(',
              '      if (!roundCounted) operations.push(op("increment", "user_profiles", p.$id, { column: "rounds", value: 1 }));\n      if (payout) operations.push(',
              'new rounds increment'
          )

          page = change(
              page,
              'One entry per player per round. Correct number pays 8× VC.',
              'Multiple different numbers allowed per round. One entry per number. Correct number pays 8× VC.',
              'game instructions'
          )

          page = change(
              page,
              '<h3>Current Round Entry</h3>',
              '<h3>Current Round Entries</h3>',
              'entries heading'
          )

          p.write_text(code)
          f.write_text(page)
          print('Backend and website patched')
          PY

      - name: Validate backend syntax
        run: node --check functions/game-wallet/src/main.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/game-wallet/src/main.js number-draw.html
          git diff --cached --quiet || (git commit -m "Allow multiple entries per round" && git push)
          
