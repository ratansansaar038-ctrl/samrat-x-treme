name: Player authentication and game navigation tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'login.html'
      - 'signup.html'
      - 'number-draw.html'
      - 'admin-dashboard.html'
      - 'signup-phone.js'
      - 'verify-phone.html'
      - 'functions/game-wallet/src/otp.js'
      - 'site-visitor.js'
      - 'functions/game-wallet/src/main.js'
      - 'functions/game-wallet/tests/**'
      - '.github/workflows/test-player-auth-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'login.html'
      - 'signup.html'
      - 'number-draw.html'
      - 'admin-dashboard.html'
      - 'signup-phone.js'
      - 'verify-phone.html'
      - 'functions/game-wallet/src/otp.js'
      - 'site-visitor.js'
      - 'functions/game-wallet/src/main.js'
      - 'functions/game-wallet/tests/**'
      - '.github/workflows/test-player-auth-navigation.yml'

permissions:
  contents: read

jobs:
  player-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify JavaScript test runtime
        run: node --version
      - name: Test signup recovery, bonus and Lucky Draw redirects
        run: |
          node --check functions/game-wallet/src/main.js
          node --test functions/game-wallet/tests/signup-recovery.test.js functions/game-wallet/tests/visitor-phone.test.js functions/game-wallet/tests/sms-otp.test.js
