name: Samrat Public Scheduler Compatibility Check

on:
  push:
    paths:
      - ".github/workflows/samrat-appwrite-function-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test public get_round without any API key
        env:
          APPWRITE_PROJECT: ${{ secrets.APPWRITE_PROJECT }}
          APPWRITE_FUNCTION_ID: ${{ secrets.APPWRITE_FUNCTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APPWRITE_PROJECT" || -z "$APPWRITE_FUNCTION_ID" ]]; then
            echo "Project or Function ID configuration missing."
            exit 1
          fi
          status=$(curl --silent --show-error --output execution.json --write-out "%{http_code}" \
            --request POST \
            --url "https://sgp.cloud.appwrite.io/v1/functions/${APPWRITE_FUNCTION_ID}/executions" \
            --header "X-Appwrite-Project: ${APPWRITE_PROJECT}" \
            --header "Content-Type: application/json" \
            --data '{"body":"{\"action\":\"get_round\"}","async":false,"method":"POST","path":"/"}')
          echo "Public Appwrite execution HTTP status: $status"
          if [[ "$status" != "201" && "$status" != "200" ]]; then
            echo "Appwrite refused public execution; do not store a privileged API key with an external scheduler."
            exit 1
          fi
          jq '{status, responseStatusCode, roundActionOk: (.responseBody | fromjson? | .ok)}' execution.json
          jq -e '.responseStatusCode == 200 and (.responseBody | fromjson | .ok == true)' execution.json >/dev/null
