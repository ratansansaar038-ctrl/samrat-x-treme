name: Install Samrat Admin Control Room

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-samrat-admin-control-room
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Samrat X-Treme
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install admin dashboard and secured read-only API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from base64 import b64decode
          
          backend_path = Path('functions/game-wallet/src/main.js')
          dashboard_path = Path('admin-dashboard.html')
          draw_path = Path('number-draw.html')
          for path in (backend_path, draw_path):
              if not path.is_file():
                  raise SystemExit(f'File missing: {path}. Changes aborted.')
          
          s = backend_path.read_text(encoding='utf-8')
          draw = draw_path.read_text(encoding='utf-8')
          patch = b64decode('').decode('utf-8')
          html = b64decode('').decode('utf-8')
          marker = '// SAMRAT ADMIN DASHBOARD V1'
          
          if marker not in s:
              checks = [
                ('async function grantCoins(', 1),
                ('    "generate_vouchers",', 1),
                ('if (action === "generate_vouchers") {', 1),
                ('async function redeemVoucher(', 1)
              ]
              for check, expected in checks:
                  if s.count(check) != expected:
                      raise SystemExit('Backend incompatible: ' + check + '. No changes written.')
              s = s.replace('async function grantCoins(', patch + '\nasync function grantCoins(', 1)
              s = s.replace('    "generate_vouchers",',
                            '    "generate_vouchers",\n    "admin_dashboard",\n    "admin_find_player",', 1)
              actions = """if (action === "admin_dashboard") {
            const d = await adminDashboard(user, key);
            return send(res, d.ok ? 200 : 403, d);
          }
          if (action === "admin_find_player") {
            const d = await adminFindPlayer(user, b, key);
            return send(res, d.ok ? 200 : 403, d);
          }
          """
              s = s.replace('if (action === "generate_vouchers") {', actions + 'if (action === "generate_vouchers") {', 1)
          else:
              if ('"admin_dashboard"' not in s or
                  'if (action === "admin_dashboard")' not in s or
                  'async function adminFindPlayer(' not in s):
                  raise SystemExit('Partial dashboard installation detected; review required.')
          
          anchor = '<section class="panel hide" id="adminPanel"><h3>Admin • Allocate Virtual Coins</h3>'
          admin_link = '<a class="btn secondary" href="admin-dashboard.html">OPEN ADMIN CONTROL ROOM</a>'
          if admin_link not in draw:
              if draw.count(anchor) != 1:
                  raise SystemExit('Number Draw admin section changed. No changes written.')
              draw = draw.replace(anchor, anchor + admin_link, 1)
          
          assert 'id="dashboard" hidden' in html
          assert "api('admin_dashboard')" in html
          assert 'dashboardIsAdmin' in s
          assert 'admin-dashboard.html' in draw
          backend_path.write_text(s, encoding='utf-8')
          dashboard_path.write_text(html, encoding='utf-8')
          draw_path.write_text(draw, encoding='utf-8')
          print('Admin Control Room files generated successfully.')
          PY
      - name: Validate backend JavaScript
        run: node --check functions/game-wallet/src/main.js
      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('admin-dashboard.html').read_text(encoding='utf-8')
          assert html.count('<script>') == 1
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/samrat-admin-ui.js').write_text(script)
          PY
          node --check /tmp/samrat-admin-ui.js
      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/game-wallet/src/main.js admin-dashboard.html number-draw.html
          if ! git diff --cached --quiet; then
            git commit -m "Add unified admin control room and server-side admin overview"
            git push
          else
            echo "Admin Control Room is already up to date."
          fi
