<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120621"><title>Memory X Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#4a1a73,#17072b 52%,#06010c);color:white;font:15px system-ui,Arial;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:20px 16px 36px}a{color:#e9c9ff;text-decoration:none}.brand{text-align:center;margin:20px 0 8px;font:900 30px Georgia;color:#ffe17c}.sub{text-align:center;letter-spacing:2px;color:#e3baff;font-size:18px;font-weight:900}.panel{background:linear-gradient(145deg,#24103e,#351454);border:1px solid #8655c9;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 8px 28px #0006}.muted{font-size:12px;color:#d5bdf3;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{background:#180a2e;border-radius:12px;padding:12px 5px;text-align:center}.stat b{display:block;color:#ffe17c;font-size:24px}.stat small{color:#d2b5f3}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;touch-action:manipulation}.tile{aspect-ratio:1;background:#35205d;border:2px solid #7e4cb6;border-radius:18px;display:grid;place-items:center;font-size:34px;color:white;cursor:pointer}.tile.target,.tile.open,.tile.matched{background:radial-gradient(circle,#fff7a2,#ffcf32 52%,#ff8c24);border-color:#fff3ac;color:#461057}.tile:disabled{opacity:.7}.tile.target:disabled{opacity:1}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level{border:1px solid #9861d6;border-radius:12px;background:#361d55;color:white;padding:12px 5px;font-weight:800}.level.selected{background:#ffcf47;color:#2b0d3e}.start{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(90deg,#ffe545,#ffa332,#ff45a0);color:#260b2c;font-size:17px;font-weight:900;margin-top:15px}.start:disabled{opacity:.55}.msg{text-align:center;min-height:43px;padding-top:12px;color:#ffe9a4;font-weight:700}.guide{background:#160b2b;border:1px solid #9861d6;border-radius:14px;padding:13px;margin:12px 0;line-height:1.7}.footer{text-align:center;font-size:11px;color:#c6addf;margin-top:20px}h2{text-align:center;color:#ffe17c}.hide{display:none}</style></head><body><main class="wrap"><a href="index.html">← Samrat X-Treme Home</a><div class="brand">SAMRAT X-TREME</div><div class="sub">🧠 MEMORY X CHALLENGE</div><section class="panel"><h2>60-Second Memory Game</h2><div class="guide">दो कार्ड खोलकर 8 जोड़ियाँ मिलाओ। गलत जोड़ी 0.7 सेकंड बाद बंद होगी।</div><p class="muted" id="mode">Checking login...</p><div class="stats"><div class="stat"><b id="time">60</b><small>SECONDS</small></div><div class="stat"><b id="pairs">0/8</b><small>PAIRS</small></div><div class="stat"><b id="best">—</b><small>BEST TIME</small></div></div><div class="grid" id="grid" style="grid-template-columns:repeat(4,1fr);gap:8px"></div><div class="msg" id="message">Press START GAME</div><button class="start" id="start">▶ START GAME</button></section><section class="panel"><h2>🏆 Online Top 10</h2><div id="leaderboard">Loading...</div><button class="start" id="refresh">Refresh ranking</button></section><div class="footer">Free skill game · No coins deducted · No cash value</div></main><script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<script>
const ENDPOINT='https://sgp.cloud.appwrite.io/v1',PROJECT='6a7f2add0011a7bfc21a',FUNCTION_ID='6ae1bcc500208a5a7efb';
let api=null, signedIn=false;
if(window.Appwrite){const {Client,Account,Functions}=Appwrite;const client=new Client().setEndpoint(ENDPOINT).setProject(PROJECT);const account=new Account(client), fn=new Functions(client);api=async(action,extra={})=>{const r=await fn.createExecution(FUNCTION_ID,JSON.stringify({action,...extra}),false);const x=JSON.parse(r.responseBody||'{}');if(!x.ok)throw Error(x.error||'Server error');return x};account.get().then(()=>{signedIn=true;document.getElementById('mode').textContent='Signed in · Online verified mode available'}).catch(()=>{document.getElementById('mode').textContent='Guest practice · Sign in on Home for online ranking'});}
async function leaderboard(gameId){const el=document.getElementById('leaderboard');if(!api){el.textContent='Appwrite unavailable';return}try{const r=await api('get_leaderboard',{gameId});el.replaceChildren();if(!r.entries.length){el.textContent='No verified scores yet';return}for(const e of r.entries){const p=document.createElement('p');p.textContent='#'+e.rank+' · '+e.player+' · '+(gameId==='speed_tap'?e.score+' pts':(e.score+'/8 pairs · '+(e.durationMs/1000).toFixed(2)+'s');el.append(p)}}catch(e){el.textContent='Leaderboard unavailable: '+e.message}}
</script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),symbols=['🌟','⚡','💎','🔥','🚀','👑','🎯','🦁'];
let deck=Array(16).fill('?'),opened=[],matched=new Set(),busy=false,playing=false,endAt=0,clock=null,token=0,session=null,events=[],started=0,best=null;
try{let v=Number(localStorage.getItem('samrat_memory_x_best_seconds'));if(v>0&&v<=60)best=v}catch{}
function showBest(){$('best').textContent=best===null?'—':best+'s'}showBest();
function render(){const g=$('grid');g.replaceChildren();deck.forEach((s,i)=>{const b=document.createElement('button');b.className='tile'+(matched.has(i)?' matched':opened.includes(i)?' open':'');b.textContent=matched.has(i)||opened.includes(i)?s:'?';b.disabled=!playing||busy||matched.has(i)||opened.includes(i);b.onclick=()=>flip(i);g.append(b)});$('pairs').textContent=matched.size/2+'/8'}
async function stop(win){if(!playing)return;playing=false;token++;clearInterval(clock);let elapsed=Math.min(60000,Math.floor(performance.now()-started)),seconds=Math.max(1,Math.ceil(elapsed/1000));$('time').textContent=win?Math.max(0,Math.ceil((endAt-performance.now())/1000)):0;if(win){if(best===null||seconds<best){best=seconds;localStorage.setItem('samrat_memory_x_best_seconds',String(best));showBest()}$('message').textContent='🎉 Completed in '+seconds+'s'}else $('message').textContent='Time over · '+matched.size/2+' pairs';$('start').textContent='↻ PLAY AGAIN';render();
if(session){try{$('message').textContent+=' · Checking server...';const r=await '✓ Verified online: '+r.score+'/8 pairs' result saved · Online not saved: '+e.message}}}
function flip(i){if(!playing||busy||opened.includes(i)||matched.has(i))return;const t=Math.floor(performance.now()-started);if(t>=60000){stop(false);return}events.push([i,t]);opened.push(i);render();if(opened.length===2){const [a,b]=opened;if(deck[a]===deck[b]){matched.add(a);matched.add(b);opened=[];$('message').textContent='Correct pair!';render();if(matched.size===16)stop(true)}else{busy=true;const round=token;$('message').textContent='Try again';setTimeout(()=>{if(round!==token)return;opened=[];busy=false;render()},700)}}}
async function start(){if(playing)return;$('start').disabled=true;session=null;if(signedIn&&api){try{session=await api('start_game',{gameId:'memory_x'});deck=session.challenge.deck}catch(e){$('message').textContent='Online unavailable, practice only: '+e.message}}
if(!session){deck=[...symbols,...symbols];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
token++;let round=token;opened=[];matched=new Set();busy=false;playing=true;events=[];started=performance.now();endAt=started+60000;$('start').disabled=false;$('start').textContent='GAME IN PROGRESS';$('start').disabled=true;$('time').textContent='60';$('message').textContent=session?'Online verified round':'Guest practice';render();clearInterval(clock);clock=setInterval(()=>{if(round!==token)return;let left=Math.max(0,Math.ceil((endAt-performance.now())/1000));$('time').textContent=left;if(left===0)stop(false)},100)}
$('start').onclick=start;render();document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){session=null;stop(false)}});$('refresh').onclick=()=>leaderboard('memory_x');leaderboard('memory_x');
})();
</script></body></html>
