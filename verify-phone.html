<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090315">
  <title>Verify Mobile OTP | Samrat X-Treme</title>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@21.4.0"></script>
  <script src="signup-phone.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#512177,#16091f 65%,#090314);color:#fff;font:15px system-ui,Arial}
    main{width:100%;max-width:430px;padding:25px 19px;border-radius:22px;border:1px solid #7c58b0;background:linear-gradient(140deg,#211334,#32174a);box-shadow:0 20px 50px #0007;text-align:center}
    h1{font-size:25px;color:#ffe18a;margin:9px 0}.small{font-size:13px;color:#d8c1f4;line-height:1.6}
    label{display:block;margin:20px 0 7px;text-align:left;font-size:13px;color:#f5dfff}
    input{display:block;width:100%;padding:15px;background:#0f071b;border:1px solid #996bc8;border-radius:12px;color:#fff;text-align:center;font-size:22px;letter-spacing:7px}
    button{width:100%;border:0;border-radius:13px;cursor:pointer;background:linear-gradient(90deg,#ffe45a,#ff9f33,#fa67b6);color:#1b0821;padding:14px;margin-top:14px;font-weight:900;font-size:14px}
    button:disabled{opacity:.6;cursor:default}.secondary{background:#46235c;border:1px solid #9f79bc;color:#fff}
    #message{min-height:36px;margin-top:14px;color:#ffd985;line-height:1.5;font-size:13px;overflow-wrap:anywhere}
    a{color:#ffe18a;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div style="font-size:39px">📱</div>
    <h1>Verify your mobile number</h1>
    <p id="phoneHint" class="small">Checking your account...</p>
    <form id="otpForm" hidden>
      <label for="otp">Enter the SMS OTP</label>
      <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,8}" maxlength="8" required placeholder="••••••" aria-label="SMS verification code">
      <button id="verifyButton" type="submit">VERIFY OTP & CONTINUE</button>
    </form>
    <button class="secondary" id="resend" type="button" hidden>RESEND OTP</button>
    <div id="message" role="status" aria-live="polite"></div>
    <p class="small">Your 1,000 VC Sign Up Bonus will be credited only after your mobile number is verified. VC has no cash value.</p>
    <p class="small"><a href="signup.html">← Signup</a> · <a href="privacy.html">Privacy</a></p>
  </main>
<script>
'use strict';
const client=new Appwrite.Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6a7f2add0011a7bfc21a');
const account=new Appwrite.Account(client),functions=new Appwrite.Functions(client);
const form=document.getElementById('otpForm'),resend=document.getElementById('resend'),verifyButton=document.getElementById('verifyButton');
const message=document.getElementById('message'),hint=document.getElementById('phoneHint');
let busy=false;
function notice(s){message.textContent=String(s)}
async function finishVerifiedSignup(){
  const user=await account.get();
  if(user.phoneVerification!==true)throw Error('Phone is not verified. Enter your OTP first.');
  const execution=await functions.createExecution({
    functionId:'6ae1bcc500208a5a7efb',
    body:JSON.stringify({action:'register_profile',name:user.name||'',email:user.email||''}),
    async:false
  });
  let response;try{response=JSON.parse(execution.responseBody||'{}')}catch{throw Error('Invalid wallet server response')}
  if(execution.responseStatusCode!==200||response.ok!==true)throw Error(response.error||'Wallet setup pending. Retry after verification.');
  if(response.created===true&&response.signupBonusVC===1000){
    try{sessionStorage.setItem('samratSignupBonusVC','1000')}catch{}
  }
  window.location.replace('number-draw.html');
}
async function prepare(){
  try{
    const user=await account.get();
    if(!user.phone){hint.textContent='Mobile number missing. Return to signup.';notice('Your mobile number must be entered before requesting OTP.');return}
    hint.textContent='Appwrite has sent an SMS code to the number ending '+user.phone.slice(-4)+'.';
    if(user.phoneVerification===true){hint.textContent='Mobile number is verified. Finishing wallet setup...';await finishVerifiedSignup();return}
    form.hidden=false;resend.hidden=false;
    notice('Enter your SMS OTP to unlock your one-time signup bonus.');
  }catch(e){notice(e.message||'Please sign in and try again.')}
}
form.addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;busy=true;verifyButton.disabled=true;notice('Verifying your OTP...');
  try{
    await SamratPhone.completePhoneVerification(account,document.getElementById('otp').value);
    notice('Mobile verified! Finalizing signup...');
    await finishVerifiedSignup();
  }catch(error){notice(error.message||'Verification failed. Check your OTP.')}
  finally{busy=false;verifyButton.disabled=false}
});
resend.addEventListener('click',async()=>{
  if(busy)return;busy=true;resend.disabled=true;notice('Sending OTP again...');
  try{
    const user=await account.get();if(user.phoneVerification)await finishVerifiedSignup();
    else{await account.createPhoneVerification();notice('New Appwrite OTP requested. Check your SMS messages.')}
  }catch(e){notice(e.message||'Unable to send OTP. Check Appwrite Phone SMS settings.')}
  finally{busy=false;resend.disabled=false}
});
prepare();
</script>
</body></html>
