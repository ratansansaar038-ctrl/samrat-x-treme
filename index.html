<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samrat X-Treme | Elite Dashboard</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #ffd700; --neon: #bc13fe; --dark: #050505; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; text-align: center; }
        
        /* LIVE PRICE TICKER */
        .price-bar { background: #000; padding: 10px; font-size: 14px; color: #00ff00; border-bottom: 1px solid #222; font-weight: bold; }

        .header { background: #111; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .balance-card { background: linear-gradient(135deg, #111 0%, #222 100%); margin: 20px auto; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1); }
        .bal-amt { font-size: 2.5rem; font-weight: bold; color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        /* NUMBER GRID */
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 20px; max-width: 450px; margin: 0 auto; }
        .num-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px 0; border-radius: 12px; font-size: 1.5rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .num-btn.active { background: var(--gold); color: black; box-shadow: 0 0 20px var(--gold); transform: scale(1.1); }

        /* FIXED BET BOX */
        .bet-box { background: #111; padding: 25px; border-radius: 25px 25px 0 0; position: fixed; bottom: 0; width: 100%; border-top: 2px solid var(--gold); box-sizing: border-box; z-index: 100; }
        input { width: 50%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; font-size: 1.2rem; margin-right: 10px; outline: none; }
        .btn-confirm { background: linear-gradient(90deg, #ffd700, #b8860b); color: black; border: none; padding: 15px 30px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div class="price-bar">
        ⚡ LIVE BITCOIN: <span id="btc-price">WAITING...</span> • GLOBAL PULSE: ACTIVE
    </div>

    <div class="header">
        <div style="text-align: left;"><small style="color:var(--gold);">ELITE MEMBER</small><br><b id="uName">Loading...</b></div>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <div class="balance-card">
        <small style="color:#666; letter-spacing: 1px;">AVAILABLE BALANCE</small>
        <div class="bal-amt">₹<span id="wallet-bal">0</span></div>
        <button style="margin-top:15px; background:transparent; border:1px solid var(--gold); color:var(--gold); padding:8px 15px; border-radius:10px; font-weight:bold;">➕ ADD MONEY</button>
    </div>

    <div class="num-grid" id="grid-container">
        <!-- Buttons 0-9 auto generate -->
    </div>

    <div style="height: 150px;"></div> <!-- Space for footer -->

    <div class="bet-box">
        <input type="number" id="bet-amt" placeholder="Amount ₹">
        <button class="btn-confirm" onclick="placeBet()">PLACE BET</button>
    </div>

<script>
    // --- APKI ASLI SUPABASE DETAILS (Maine Fit Kar Di Hain) ---
    const SUPABASE_URL = "https://ugqcxyjrtjzgrsjnsdzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Vh_h43bueeQGhN_vXeey6w_V0rnZ"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const userId = localStorage.getItem("xtreme_user_id");
    if(!userId) window.location.href = "login.html";

    let selectedNum = null;

    // 1. Grid Generate
    const grid = document.getElementById('grid-container');
    for(let i=0; i<=9; i++) {
        grid.innerHTML += <button class="num-btn" onclick="selectN(${i}, this)">${i}</button>;
    }
    function selectN(n, btn) {
        selectedNum = n;
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // 2. Load User Profile & Wallet
    async function loadUserData() {
        const { data, error } = await _supabase
            .from('users_xtreme')
            .select('*')
            .eq('id', userId)
            .single();

        if(data) {
            document.getElementById("uName").innerText = data.name;
            document.getElementById("wallet-bal").innerText = data.wallet;
        }
    }

    // 3. Live BTC Price Ticker
    async function fetchBTC() {
        try {
            const res = await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot");
            const data = await res.json();
            document.getElementById("btc-price").innerText = "$" + data.data.amount;
        } catch(e) { console.log("Price fetch failed"); }
    }

    // 4. Bet Logic
    async function placeBet() {
        const amt = parseInt(document.getElementById("bet-amt").value);
        if(selectedNum === null || isNaN(amt) || amt < 10) return alert("Number aur Sahi Amount dalo!");

        const { error } = await _supabase
            .from('bets_xtreme')
            .insert([{ user_id: userId, number: selectedNum.toString(), amount: amt, status: 'pending' }]);
        
        if(!error) {
            alert("Global Analysis Submitted! ✅");
            document.getElementById("bet-amt").value = "";
        } else {
            alert("Error: " + error.message);
        }
    }

    function logout() { localStorage.clear(); window.location.href = "login.html"; }

    // Start everything
    loadUserData();
    fetchBTC();
    setInterval(fetchBTC, 10000); // 10 sec price refresh
</script>
</body>
</html>
