<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samrat X-Treme — Full index.html</title>
<style>body{background:#140b22;color:white;font:16px Arial;padding:22px;max-width:550px;margin:auto}button{padding:18px;width:100%;background:#f8c84a;color:#23102b;border:0;border-radius:12px;font-size:17px;font-weight:bold}p{line-height:1.6}#status{margin-top:20px;color:#d5c0ff}</style></head>
<body><h2>Samrat X-Treme</h2><p>यह टूल GitHub की मौजूदा <b>पूरी index.html</b> पढ़कर उसी में पुराने Install बटन को Direct APK Download से बदलता है। गेम का बाकी कोड सुरक्षित रहेगा।</p>
<button id="go">पूरी नई index.html डाउनलोड करें</button><p id="status"></p>
<script>
document.getElementById('go').onclick=async()=>{
const status=document.getElementById('status');status.textContent='GitHub से पूरी फाइल पढ़ रहे हैं...';
try{
const source='https://raw.githubusercontent.com/ratansansaar038-ctrl/samrat-x-treme/main/index.html';
const res=await fetch(source+'?t='+Date.now(),{cache:'no-store'});
if(!res.ok)throw Error('GitHub से फाइल नहीं मिली: '+res.status);
let html=await res.text();
const oldMarkup='<div class="install-wrap" id="installWrap"><button class="install-btn" id="installButton" type="button">📲 INSTALL SAMRAT X-TREME</button>';
if(!html.includes(oldMarkup))throw Error('बटन का मौजूदा कोड बदल गया है। कोई फाइल नहीं बदली।');
html=html.replace(oldMarkup,'<div class="install-wrap show" id="installWrap"><button class="install-btn" id="installButton" type="button">📲 DOWNLOAD ANDROID APK</button>');
html=html.replace('Free app installation — no APK required.','Direct Android APK download (2.68 MB).');
const begin=html.indexOf('let deferredInstallPrompt=null;');
const end=html.indexOf("if('serviceWorker' in navigator)",begin);
if(begin<0||end<0)throw Error('पुराना Install कोड नहीं मिला। कोई फाइल नहीं बदली।');
const replacement=`const installButton=el('installButton'),installHelp=el('installHelp');
const apkDownloadUrl='https://github.com/ratansansaar038-ctrl/samrat-x-treme/releases/download/v1.0.0/app-debug.apk';
el('installWrap').style.display='block';
installButton.disabled=false;
installHelp.textContent='Download the Android APK (2.68 MB).';
installButton.addEventListener('click',()=>{window.location.href=apkDownloadUrl;});
`;
html=html.slice(0,begin)+replacement+html.slice(end);
const blob=new Blob([html],{type:'text/html;charset=utf-8'});
const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
status.textContent='पूरी नई index.html तैयार है। Downloads में देखें।';
}catch(e){status.textContent='समस्या: '+e.message;}
};
</script></body></html>
