<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password | Samrat X-Treme</title><script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#431267,#16051f 50%,#050108);color:white;font-family:Arial,sans-serif}.card{width:100%;max-width:430px;padding:26px;border:1px solid #7046d8;border-radius:20px;background:#1b102d}h1{color:#ffe16a}label{display:block;margin:16px 0 7px}input,button{width:100%;padding:14px;border-radius:11px;font-size:15px}input{background:#0e0819;color:#fff;border:1px solid #7046d8}button{margin-top:20px;border:0;background:#ffe16a;color:#1a1025;font-weight:bold}button:disabled{opacity:.5}a{color:#ffe16a}#msg{margin-top:15px;line-height:1.5}</style></head><body><main class="card"><h1>Set New Password</h1><form id="f"><label>New password (at least 8 characters)</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required><label>Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="b">Update Password</button></form><p id="msg" role="status" aria-live="polite"></p><p><a href="login.html">Back to Login</a></p></main><script>const client=new Appwrite.Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6a7f2add0011a7bfc21a');const account=new Appwrite.Account(client);const q=new URLSearchParams(location.search),uid=q.get('userId'),secret=q.get('secret'),m=document.getElementById('msg');if(!uid||!secret){m.textContent='Invalid or expired reset link. Request a new link.';document.getElementById('b').disabled=true}document.getElementById('f').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pass').value,c=document.getElementById('confirm').value,b=document.getElementById('b');if(p!==c){m.textContent='Passwords do not match.';return}b.disabled=true;m.textContent='Updating...';try{await account.updateRecovery({userId:uid,secret:secret,password:p});m.textContent='Password updated successfully. Go to Login.';document.getElementById('f').style.display='none'}catch(err){m.textContent='Reset failed: '+(err.message||'Please request a new link.');b.disabled=false}};</script></body></html>
