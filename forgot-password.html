<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | Samrat X-Treme</title><script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#431267,#16051f 50%,#050108);color:white;font-family:Arial,sans-serif}.card{width:100%;max-width:430px;padding:26px;border:1px solid #7046d8;border-radius:20px;background:#1b102d}h1{color:#ffe16a}label{display:block;margin:16px 0 7px}input,button{width:100%;padding:14px;border-radius:11px;font-size:15px}input{background:#0e0819;color:#fff;border:1px solid #7046d8}button{margin-top:20px;border:0;background:#ffe16a;color:#1a1025;font-weight:bold}button:disabled{opacity:.5}a{color:#ffe16a}#msg{margin-top:15px;line-height:1.5}</style></head><body><main class="card"><h1>Forgot Password</h1><p>Enter your registered email. We will send a password reset link.</p><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" required><button id="b">Send Reset Link</button></form><p id="msg" role="status" aria-live="polite"></p><p><a href="login.html">Back to Login</a></p></main><script>const client=new Appwrite.Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6a7f2add0011a7bfc21a');const account=new Appwrite.Account(client);document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('msg');b.disabled=true;m.textContent='Sending...';try{await account.createRecovery({email:document.getElementById('email').value.trim(),url:new URL('reset-password.html',location.href).href});m.textContent='If the account is eligible, check your inbox and spam folder for the reset link.'}catch(err){m.textContent='Unable to send reset email: '+(err.message||'Please try again.')}finally{b.disabled=false}};</script></body></html>
