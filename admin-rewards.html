<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08010f">
<title>Reward Admin | Samrat X-Treme</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#431267,#08010f 70%);font:14px system-ui,Arial;color:#fff;padding:18px}.app{max-width:850px;margin:auto}.head,.card{background:#1c112b;border:1px solid #57377c;border-radius:18px;padding:18px;margin-bottom:14px}.head{text-align:center}h1{color:#ffe16a;font-size:24px;margin:0 0 7px}.muted{color:#b4a6c6;font-size:12px}.links{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}a,.btn{background:#392057;border:1px solid #754da3;color:white;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.approve{background:#18583b}.reject{background:#6b243a}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.row{display:flex;justify-content:space-between;gap:15px;padding:6px 0;border-bottom:1px solid #382a49}.row span:first-child{color:#b4a6c6}.row span:last-child{text-align:right;overflow-wrap:anywhere}.status{padding:12px 0;color:#ffd66b;text-align:center;min-height:42px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#32203e;color:#ffd66b;font-weight:700}.empty{text-align:center;padding:24px;color:#b4a6c6}
</style>
</head>
<body>
<main class="app">
<section class="head">
<h1>SAMRAT X-TREME</h1>
<div class="muted">REWARD ADMIN PANEL</div>
<div class="links"><a href="index.html">Home</a><a href="admin-add-vc.html">Add VC</a><a href="reward.html">Rewards</a></div>
</section>
<div class="status" id="status">Checking admin access...</div>
<div id="claims"><div class="empty">Loading...</div></div>
</main>
<script>
'use strict';
const PROJECT_ID='6a7f2add0011a7bfc21a';
const DATABASE_ID='6a7f2d1d0035d9815939';
const CLAIMS_TABLE='reward_claims';
const ADMIN_ID='6a8031600025646ad144';
const APPROVAL_FUNCTION_ID='6adf3c3a003718eab6c2';
const client=new Appwrite.Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject(PROJECT_ID);
const account=new Appwrite.Account(client);
const db=new Appwrite.TablesDB(client);
const functions=new Appwrite.Functions(client);
const $=id=>document.getElementById(id);
let isAdmin=false;
function message(text,color='#ffd66b'){$('status').textContent=text;$('status').style.color=color}
function addRow(parent,label,value){const row=document.createElement('div');row.className='row';const left=document.createElement('span');left.textContent=label;const right=document.createElement('span');right.textContent=String(value??'—');row.append(left,right);parent.append(row)}
function renderClaim(claim){
 const card=document.createElement('section');card.className='card';
 const heading=document.createElement('div');heading.className='pill';heading.textContent=String(claim.status||'UNKNOWN').toUpperCase();card.append(heading);
 addRow(card,'Reward',claim.rewardName);addRow(card,'User ID',claim.userId);addRow(card,'Points',claim.pointUsed);addRow(card,'Claim ID',claim.$id);addRow(card,'Submitted',claim.claimedAt||claim.$createdAt);
 if(String(claim.status||'').toLowerCase()==='pending'){
  const actions=document.createElement('div');actions.className='actions';
  for(const [label,decision,css] of [['Approve','approved','approve'],['Reject','rejected','reject']]){
   const button=document.createElement('button');button.type='button';button.className='btn '+css;button.textContent=label;
   button.addEventListener('click',()=>updateClaim(claim.$id,decision));actions.append(button);
  }
  card.append(actions);
 }
 return card;
}
async function loadClaims(){
 if(!isAdmin)return;
 message('Loading reward claims...');
 try{
  const result=await db.listRows({databaseId:DATABASE_ID,tableId:CLAIMS_TABLE,queries:[Appwrite.Query.limit(100)]});
  const rows=result.rows||[];rows.sort((a,b)=>new Date(b.claimedAt||b.$createdAt||0)-new Date(a.claimedAt||a.$createdAt||0));
  const container=$('claims');container.replaceChildren();
  if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No reward claims found.';container.append(empty)}
  for(const claim of rows)container.append(renderClaim(claim));
  message('Claims loaded: '+rows.length,'#60ff9a');
 }catch(e){console.error(e);message('Unable to load claims: '+(e.message||e),'#ff7088')}
}
async function updateClaim(claimId,decision){
 if(!isAdmin)return;
 if(!['approved','rejected'].includes(decision))return;
 if(!confirm('Claim ko '+decision+' karna hai?'))return;
 document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);
 message('Processing through secure backend...');
 try{
  const execution=await functions.createExecution({functionId:APPROVAL_FUNCTION_ID,body:JSON.stringify({claimId,decision}),async:false,method:'POST',path:'/'});
  let result={};try{result=JSON.parse(execution.responseBody||'{}')}catch{throw new Error('Invalid backend response')}
  if(execution.status!=='completed'||execution.responseStatusCode!==200||result.ok!==true)throw new Error(result.error||execution.errors||'Backend rejected request');
  message('Claim '+decision+' successfully.','#60ff9a');await loadClaims();
 }catch(e){console.error(e);message('Not changed: '+(e.message||e),'#ff7088');document.querySelectorAll('.actions button').forEach(b=>b.disabled=false)}
}
async function start(){
 try{const user=await account.get();if(user.$id!==ADMIN_ID){message('Access denied. Admin login required.','#ff7088');$('claims').replaceChildren();return}isAdmin=true;await loadClaims()}
 catch(e){console.error(e);message('Please login as admin.','#ff7088');$('claims').replaceChildren()}
}
start();
</script>
</body>
</html>
