<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Treme Signup | Samrat Global</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; padding: 30px; border-radius: 20px; border: 2px solid #ffd700; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 0 30px rgba(255, 215, 0, 0.1); }
        h2 { color: #ffd700; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        .btn-reg { width: 100%; padding: 14px; background: linear-gradient(90deg, #ffd700, #b8860b); color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>X-TREME JOIN</h2>
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="phone" placeholder="Mobile Number">
    <input type="password" id="pass" placeholder="Access PIN">
    <button class="btn-reg" onclick="register()">ACTIVATE ELITE ACCESS</button>
</div>

<script>
    // --- SUPABASE CONFIG ---
    // Bhai yahan apni Supabase details dalo
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "YOUR_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function register() {
        const n = document.getElementById("name").value.trim();
        const p = document.getElementById("phone").value.trim();
        const pw = document.getElementById("pass").value.trim();

        if(!n || !p || !pw) return alert("Details bharo bhai!");

        // Supabase mein data insert karna
        const { data, error } = await supabase
            .from('users_xtreme')
            .insert([{ name: n, phone: p, password: pw, wallet: 0, status: 'active' }]);

        if (error) {
            alert("Error: " + error.message);
        } else {
            alert("Elite Account Activated! Now Login.");
            window.location.href = "login.html";
        }
    }
</script>
</body>
</html>
