<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08010f">

<title>Elite Signup | Samrat X-Treme</title>

<script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#fff;
background:
radial-gradient(circle at 50% 0%,#3f1769 0%,#15051f 42%,#050108 75%,#000 100%)
}

.card{
width:100%;
max-width:420px;
padding:30px 22px;
border-radius:24px;
background:linear-gradient(145deg,#171027,#281047);
border:1px solid #7046d8;
box-shadow:0 0 35px rgba(111,50,255,.35)
}

.logo{
width:220px;
max-width:82%;
display:block;
margin:0 auto 14px;
filter:drop-shadow(0 0 15px rgba(143,59,255,.7))
}

h1{
text-align:center;
font-size:25px;
margin-bottom:5px;
color:#ffe16a
}

.sub{
text-align:center;
color:#a99bc5;
font-size:12px;
margin-bottom:24px
}

label{
display:block;
margin:13px 0 6px;
font-size:11px;
color:#c9b9ee
}

input{
width:100%;
padding:14px;
border-radius:13px;
border:1px solid #51388d;
background:#0e0819;
color:#fff;
outline:none;
font-size:14px
}

input:focus{
border-color:#9c6dff;
box-shadow:0 0 12px rgba(122,63,255,.35)
}

.ref-note{
margin-top:6px;
font-size:9px;
color:#807295;
line-height:1.4
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:15px;
cursor:pointer;
font-size:15px;
font-weight:900;
color:#210014;
background:linear-gradient(90deg,#ffe033,#ff8b00,#ff2b9d);
box-shadow:0 0 20px rgba(255,74,143,.35)
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

#message{
min-height:22px;
margin-top:14px;
text-align:center;
font-size:12px;
line-height:1.4;
color:#ffb7db
}

.login{
margin-top:18px;
text-align:center;
color:#9587ad;
font-size:12px
}

.login a{
color:#ffd85d;
text-decoration:none;
font-weight:800
}

.note{
margin-top:20px;
text-align:center;
color:#675d76;
font-size:9px;
line-height:1.5
}
</style>
</head>

<body>

<div class="card">

<img src="samrat-logo.png" class="logo" alt="Samrat X-Treme">

<h1>ELITE SIGNUP</h1>

<div class="sub">
Create your Samrat X-Treme account
</div>

<form id="signupForm">

<label>Name</label>

<input
id="name"
type="text"
placeholder="Enter your name"
maxlength="128"
autocomplete="name"
required
>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Minimum 8 characters"
minlength="8"
autocomplete="new-password"
required
>

<label>Confirm Password</label>

<input
id="confirmPassword"
type="password"
placeholder="Enter password again"
minlength="8"
autocomplete="new-password"
required
>

<label>Referral Code (Optional)</label>

<input
id="referralInput"
type="text"
placeholder="Enter referral code"
maxlength="32"
autocomplete="off"
>

<div class="ref-note">
Agar aap referral link se aaye hain to code automatically fill ho jayega.
</div>

<button id="signupButton" type="submit" disabled>
CHECKING...
</button>

</form>

<div id="message">
Checking account...
</div>

<div class="login">
Already registered?
<a href="login.html">LOGIN</a>
</div>

<div class="note">
Entertainment / educational game only.<br>
Virtual coins have no cash value.
</div>

</div>

<script>

/* =========================
   APPWRITE CONFIG
========================= */

const APPWRITE_ENDPOINT =
"https://sgp.cloud.appwrite.io/v1";

const APPWRITE_PROJECT_ID =
"6a7f2add0011a7bfc21a";

const APPWRITE_DATABASE_ID =
"6a7f2d1d0035d9815939";

const USER_PROFILES_TABLE =
"user_profiles";

const REFERRALS_TABLE =
"referrals";

const REFERRAL_REWARD_POINTS =
100;


/* =========================
   APPWRITE CLIENT
========================= */

const client =
new Appwrite.Client();

client
.setEndpoint(APPWRITE_ENDPOINT)
.setProject(APPWRITE_PROJECT_ID);

const account =
new Appwrite.Account(client);

const tablesDB =
new Appwrite.TablesDB(client);


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById("signupForm");

const button =
document.getElementById("signupButton");

const message =
document.getElementById("message");

const referralInput =
document.getElementById("referralInput");


/* =========================
   GET REF CODE FROM URL
========================= */

const urlParams =
new URLSearchParams(window.location.search);

const urlReferral =
(urlParams.get("ref") || "")
.trim()
.toUpperCase();

if(urlReferral){

referralInput.value =
urlReferral;

}


/* =========================
   GENERATE REFERRAL CODE
========================= */

function generateReferralCode(name,userId){

const cleanName =
(name || "SAMRAT")
.replace(/[^a-zA-Z0-9]/g,"")
.toUpperCase()
.slice(0,5);

const idPart =
userId
.replace(/[^a-zA-Z0-9]/g,"")
.toUpperCase()
.slice(-6);

return (
(cleanName || "SAMRAT") +
idPart
);

}


/* =========================
   PREPARE SIGNUP PAGE
========================= */

async function prepareSignupPage(){

  const hasReferral =
    new URLSearchParams(window.location.search).has("ref");

  try{

    const user = await account.get();

    if(hasReferral){

      button.disabled = true;
      button.innerText = "LOGOUT REQUIRED";

      message.style.color = "#ffcf79";
      message.innerHTML =
        'Aap already <b>' +
        (user.email || "logged in") +
        '</b> account se logged in ho.<br><br>' +
        '<button type="button" onclick="logoutForReferralSignup()" ' +
        'style="margin-top:10px;padding:12px;border:0;border-radius:12px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#ffe033,#ff8b00,#ff2b9d);">' +
        'LOGOUT & CREATE NEW ACCOUNT' +
        '</button>';

      return;
    }

    window.location.replace("index.html");

  }catch(error){

    button.disabled = false;
    button.innerText = "ACTIVATE ACCOUNT";
    message.innerText = "";

  }
}


async function logoutForReferralSignup(){

  try{

    message.style.color = "#ffcf79";
    message.innerText = "Logging out...";

    await account.deleteSession({
      sessionId:"current"
    });

    button.disabled = false;
    button.innerText = "ACTIVATE ACCOUNT";

    message.style.color = "#60ff9a";
    message.innerText =
      "Logout successful ✅ Ab naya account banao.";

  }catch(error){

    console.error("Referral logout error:", error);

    message.style.color = "#ff6b87";
    message.innerText =
      "Logout nahi hua. Page refresh karke dobara try karo.";

  }
}




/* =========================
   FIND REFERRER
========================= */

async function findReferrerByCode(code){

if(!code){
return null;
}

try{

const response =
await tablesDB.listRows({

databaseId:
APPWRITE_DATABASE_ID,

tableId:
USER_PROFILES_TABLE,

queries:[
Appwrite.Query.limit(100)
],

total:false,

ttl:0

});

const rows =
response.rows || [];

const wanted =
code.trim().toUpperCase();

return rows.find(row =>
String(row.referralCode || "")
.trim()
.toUpperCase() === wanted
) || null;

}catch(error){

console.error(
"Referral lookup error:",
error
);

return null;

}

}


/* =========================
   PROCESS REFERRAL
========================= */

async function processReferral(
newUser,
enteredReferralCode
){

const code =
(enteredReferralCode || "")
.trim()
.toUpperCase();

if(!code){
return;
}

const referrer =
await findReferrerByCode(code);

if(!referrer){

console.warn(
"Invalid referral code:",
code
);

return;

}

/* self referral protection */

if(
referrer.$id === newUser.$id ||
referrer.userId === newUser.$id
){

return;

}

try{

/* create referral history */

await tablesDB.createRow({

databaseId:
APPWRITE_DATABASE_ID,

tableId:
REFERRALS_TABLE,

rowId:
Appwrite.ID.unique(),

data:{

referrerUserId:
String(
referrer.userId ||
referrer.$id
),

referredUserId:
String(newUser.$id),

referralCode:
code,

Points:
Number(
REFERRAL_REWARD_POINTS
),

createdAt:
new Date().toISOString()

}

});


/* add points to referrer */

const oldReferralPoints =
Number(
referrer.referralPoints
) || 0;

await tablesDB.updateRow({

databaseId:
APPWRITE_DATABASE_ID,

tableId:
USER_PROFILES_TABLE,

rowId:
referrer.$id,

data:{

referralPoints:
oldReferralPoints +
REFERRAL_REWARD_POINTS

}

});

console.log(
"Referral reward added ✅"
);

}catch(error){

console.error(
"Referral reward error:",
error
);

}

}


/* =========================
   SIGNUP
========================= */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();

if(button.disabled){
return;
}

const name =
document
.getElementById("name")
.value
.trim();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const confirmPassword =
document
.getElementById("confirmPassword")
.value;

const enteredReferralCode =
referralInput
.value
.trim()
.toUpperCase();


if(!name){

message.style.color=
"#ff6b87";

message.innerText=
"Name enter karo.";

return;

}


if(password.length<8){

message.style.color=
"#ff6b87";

message.innerText=
"Password kam se kam 8 characters ka hona chahiye.";

return;

}


if(password!==confirmPassword){

message.style.color=
"#ff6b87";

message.innerText=
"Password aur Confirm Password match nahi kar rahe.";

return;

}


button.disabled=true;

button.innerText=
"CREATING ACCOUNT...";

message.style.color=
"#ffcf79";

message.innerText=
"Account create ho raha hai...";


try{

/* CREATE APPWRITE USER */

const newUser =
await account.create({

userId:
Appwrite.ID.unique(),

email:
email,

password:
password,

name:
name

});


/* LOGIN USER */

await account.createEmailPasswordSession({

email:
email,

password:
password

});


/* GENERATE OWN REFERRAL CODE */

const ownReferralCode =
generateReferralCode(
name,
newUser.$id
);


/* CREATE USER PROFILE */

await tablesDB.createRow({

databaseId:
APPWRITE_DATABASE_ID,

tableId:
USER_PROFILES_TABLE,

rowId:
newUser.$id,

data:{

userId:
newUser.$id,

name:
name,

email:
email,

wallet:
10000,

wins:
0,

losses:
0,

rounds:
0,

referralCode:
ownReferralCode,

referredBy:
enteredReferralCode || "",

referralPoints:
0

}

});


/* PROCESS REFERRER REWARD */

if(enteredReferralCode){

await processReferral(
newUser,
enteredReferralCode
);

}


/* CLEAR OLD DEVICE DATA */

localStorage.removeItem(
"samratWallet"
);

localStorage.removeItem(
"samratHistory"
);

localStorage.removeItem(
"samratRound"
);


/* SUCCESS */

message.style.color=
"#60ff9a";

message.innerText=
"Account successfully created ✅";


setTimeout(function(){

window.location.replace(
"index.html"
);

},700);


}catch(error){

console.error(
"Signup error:",
error
);

message.style.color=
"#ff6b87";

message.innerText =
error && error.message
? error.message
: "Signup failed. Please try again.";

button.disabled=false;

button.innerText=
"ACTIVATE ACCOUNT";

}

});


prepareSignupPage();

</script>

</body>
</html>
