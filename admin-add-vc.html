<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add VC | Samrat X-Treme</title><script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:radial-gradient(circle at top,#431267,#08010f 70%);color:white;font-family:Arial,sans-serif}.wrap{max-width:540px;margin:auto}.card{background:#201033;border:1px solid #7046d8;border-radius:18px;padding:20px;margin-top:18px}h1{color:#ffe16a}label{display:block;margin:15px 0 7px}input,button{width:100%;padding:14px;border-radius:10px;font-size:16px}input{background:#10091b;color:#fff;border:1px solid #7046d8}button{background:#ffe16a;border:0;font-weight:bold;margin-top:20px}button:disabled{opacity:.5}a{color:#ffe16a}#status{margin-top:16px;white-space:pre-wrap;line-height:1.5}</style></head><body><div class="wrap"><a href="admin-rewards.html">← Reward Admin</a><div class="card"><h1>ADD VC</h1><p>Admin-only virtual coin grant. No cash or payments.</p><p id="who">Checking login...</p><form id="form"><label>User ID (Appwrite Auth userId)</label><input id="userId" required maxlength="36" autocomplete="off" placeholder="User's userId"><label>VC to add</label><input id="amount" required type="number" min="1" max="100000" step="1" inputmode="numeric" placeholder="e.g. 1000"><button id="send" disabled>ADD VC</button></form><div id="status" role="status"></div></div></div><script>
const client=new Appwrite.Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6a7f2add0011a7bfc21a');
const account=new Appwrite.Account(client),functions=new Appwrite.Functions(client),FUNCTION_ID='6adf3c3a003718eab6c2',ADMIN_USER_ID='6a8031600025646ad144';
const el=id=>document.getElementById(id);let admin=false;
(async()=>{try{const user=await account.get();if(user.$id!==ADMIN_USER_ID){el('who').textContent='Access denied: this account is not the admin.';return;}admin=true;el('who').textContent='Signed in: '+(user.email||user.name);el('send').disabled=false;}catch(e){el('who').textContent='Please log in first.';}})();
el('form').addEventListener('submit',async e=>{e.preventDefault();if(!admin)return;const userId=el('userId').value.trim(),amount=Number(el('amount').value);if(!/^[a-zA-Z0-9._-]{1,36}$/.test(userId)||!Number.isSafeInteger(amount)||amount<1||amount>100000){el('status').textContent='Enter valid user ID and VC amount (1–100000).';return;}if(!confirm('Add '+amount+' VC to user '+userId+'?'))return;el('send').disabled=true;el('status').textContent='Adding VC...';try{const execution=await functions.createExecution({functionId:FUNCTION_ID,body:JSON.stringify({action:'add_vc',userId,amount}),async:false,method:'POST',path:'/'});let result={};try{result=JSON.parse(execution.responseBody||'{}')}catch{}if(execution.status==='completed'&&execution.responseStatusCode===200&&result.ok){el('status').textContent='Success: '+result.added+' VC added. New wallet: '+result.balance+' VC.';}else{el('status').textContent='Not added: '+(result.error||execution.errors||('HTTP '+execution.responseStatusCode));}}catch(err){el('status').textContent='Not added: '+(err.message||String(err));}finally{el('send').disabled=false;}});
</script></body></html>
