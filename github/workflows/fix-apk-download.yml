
name: Fix Permanent APK Download
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add permanent download button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          url = "https://github.com/ratansansaar038-ctrl/samrat-x-treme/releases/latest/download/Samrat-X-Treme.apk"
          button = f'''
          <section class="panel" style="text-align:center">
            <h3>ANDROID APP</h3>
            <a class="btn" href="{url}">
              ⬇ DOWNLOAD ANDROID APK
            </a>
          </section>
          '''
          if 'id="permanentApkDownload"' not in s:
              button = button.replace(
                  '<section class="panel"',
                  '<section id="permanentApkDownload" class="panel"',
                  1
              )
              s = s.replace(
                  '<section class="panel game">',
                  button + '\n<section class="panel game">',
                  1
              )
          p.write_text(s)
          PY

      - name: Enable GitHub Release publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/android-apk.yml")
          s = p.read_text()
          s = s.replace("contents: read", "contents: write")
          if "Publish permanent APK" not in s:
              s += '''
      - name: Publish permanent APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 || gh release create v1.0.0 --title "Samrat X-Treme Android" --notes "Official signed Android APK"
          gh release upload v1.0.0 app/build/outputs/apk/release/app-release.apk#Samrat-X-Treme.apk --clobber
'''
          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/android-apk.yml
          git diff --cached --quiet || (git commit -m "Add permanent APK download" && git push)
          
