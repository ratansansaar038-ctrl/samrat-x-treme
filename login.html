<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Login | Samrat X-Treme</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; padding: 35px; border-radius: 25px; border: 1px solid #ffd700; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 0 30px rgba(255, 215, 0, 0.15); }
        h2 { color: #ffd700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; outline: none; font-size: 16px; }
        input:focus { border-color: #ffd700; }
        .btn-login { width: 100%; padding: 15px; background: linear-gradient(90deg, #ffd700, #b8860b); color: black; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 18px; margin-top: 15px; text-transform: uppercase; }
        .footer-link { margin-top: 20px; font-size: 13px; color: #666; }
        .footer-link a { color: #ffd700; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Elite Login</h2>
    <input type="text" id="loginPhone" placeholder="Mobile Number">
    <input type="password" id="loginPass" placeholder="Access PIN">
    <button class="btn-login" onclick="handleLogin()">Enter Portal</button>
    
    <div class="footer-link">
        New Member? <a href="signup.html">Join Elite</a>
    </div>
</div>

<script>
    // --- APKI SUPABASE DETAILS ---
    const SUPABASE_URL = "https://ugqcxyjrtjzgrsjnsdzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Vh_h43bueeQGhN_vXeey6w_V0rnZ"; // Check karein ye pichli wali hi hai na?
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
        const phone = document.getElementById("loginPhone").value.trim();
        const pass = document.getElementById("loginPass").value.trim();

        if(!phone || !pass) return alert("Bhai details dalo!");

        // Supabase se user check karna
        const { data, error } = await _supabase
            .from('users_xtreme')
            .select('*')
            .eq('phone', phone)
            .eq('password', pass)
            .single();

        if (error || !data) {
            alert("Galat Details! Pehle Signup karein.");
        } else {
            // User ki ID mobile mein save karna
            localStorage.setItem("xtreme_user_id", data.id);
            localStorage.setItem("xtreme_user_name", data.name);
            
            alert("Welcome to Elite Portal, " + data.name);
            window.location.href = "index.html"; // Ye seedha Dashboard par le jayega
        }
    }
</script>
</body>
</html>
