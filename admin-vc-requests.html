<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VC Requests | Samrat X-Treme Admin</title><script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#431267,#08010f 70%);color:white;font:14px Arial}.wrap{max-width:850px;margin:auto}.card{background:#1e112e;border:1px solid #65439b;border-radius:16px;padding:18px;margin:12px 0}h1{color:#ffe16a}a{color:#ffe16a}.muted{color:#b7a8c7}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #423050}.row span:last-child{word-break:break-all;text-align:right}.buttons{display:flex;gap:10px;margin-top:14px}button{padding:12px 16px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.approve{background:#68efb2}.reject{background:#ff8d9d}.refresh{background:#ffe16a}.status{margin:12px 0;color:#ffe16a;white-space:pre-wrap}</style></head><body><main class="wrap"><h1>SAMRAT X-TREME</h1><p class="muted">ADMIN • VC REQUESTS</p><p><a href="admin-add-vc.html">Manual Add VC</a> · <a href="admin-rewards.html">Reward Admin</a> · <a href="index.html">Home</a></p><button class="refresh" id="refresh" disabled>REFRESH REQUESTS</button><div class="status" id="status">Checking admin...</div><div id="requests"></div></main><script>'use strict';const client=new Appwrite.Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6a7f2add0011a7bfc21a'),account=new Appwrite.Account(client),functions=new Appwrite.Functions(client),FUNCTION_ID='6adf3c3a003718eab6c2',ADMIN_USER_ID='6a8031600025646ad144';const $=id=>document.getElementById(id);let admin=false;async function run(action,extra={}){const x=await functions.createExecution({functionId:FUNCTION_ID,body:JSON.stringify({action,...extra}),async:false,method:'POST',path:'/'});let r={};try{r=JSON.parse(x.responseBody||'{}')}catch{}if(x.status!=='completed'||x.responseStatusCode!==200||!r.ok)throw Error(r.error||x.errors||'Request failed');return r;}function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}async function load(){if(!admin)return;$('refresh').disabled=true;$('status').textContent='Loading requests...';$('requests').replaceChildren();try{const r=await run('list_vc_requests');const items=r.requests||[];$('status').textContent=items.length+' requests ('+items.filter(x=>x.status==='pending').length+' pending)';if(!items.length)$('requests').append(node('p','No requests yet.','muted'));for(const item of items){const card=node('section','', 'card');for(const [k,v] of [['Request',item.requestId||item.id||'MISSING — approval disabled'],['Player ID',item.userId],['Amount',Number(item.amount).toLocaleString('en-IN')+' VC'],['Status',item.status],['Created',item.createdAt?new Date(item.createdAt).toLocaleString('en-IN'):'-']]){const row=node('div','','row');row.append(node('span',k),node('span',v));card.append(row);}if(item.status==='pending'){const buttons=node('div','','buttons');for(const decision of ['approved','rejected']){const btn=node('button',decision==='approved'?'APPROVE':'REJECT',decision==='approved'?'approve':'reject');btn.onclick=async()=>{if(!(item.requestId||item.id)){ $('status').textContent='Request ID missing in list response. Approval blocked. Backend list must return row ID.';return;}if(!confirm((decision==='approved'?'Credit ':'Reject ')+item.amount+' VC request for '+item.userId+'?'))return;buttons.querySelectorAll('button').forEach(b=>b.disabled=true);$('status').textContent='Processing request...';try{const result=await run('decide_vc_request',{requestId:(item.requestId||item.id),decision});$('status').textContent='Request '+result.status+(result.balance!==undefined?'. Wallet: '+result.balance+' VC':'');await load();}catch(e){$('status').textContent='ERROR: '+e.message+' — do not repeat if request is processing.';buttons.querySelectorAll('button').forEach(b=>b.disabled=false);}};buttons.append(btn);}card.append(buttons);}if(item.status==='processing')card.append(node('p','Processing: check wallet and function logs. Never credit twice.','muted'));$('requests').append(card);}}catch(e){$('status').textContent='Cannot load requests: '+e.message;}finally{$('refresh').disabled=false;}}$('refresh').onclick=load;(async()=>{try{const user=await account.get();if(user.$id!==ADMIN_USER_ID){$('status').textContent='Access denied.';return;}admin=true;await load();}catch(e){$('status').textContent='Admin login required.';}})();</script></body></html>
